<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TNSF Kadapa Parliament Website Launch</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            width: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* Fullscreen Background Image Container */
        .hero-container {
            /* Replace 'bg-image.jpg' with the actual filename/path of your image */
            background-image: url('bg-image.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Subtle dark overlay for better button visibility (optional) */
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.15);
            z-index: 1;
        }

        /* Centered Yellow Launch Button */
        .launch-btn {
            position: relative;
            z-index: 2;
            padding: 18px 48px;
            font-size: 1.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #1a1a1a;
            background: linear-gradient(135deg, #FFE600 0%, #FFB700 100%);
            border: 3px solid #FFFFFF;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.4), 
                        0px 0px 20px rgba(255, 230, 0, 0.6);
            transition: all 0.3s ease;
            display: inline-block;
            text-align: center;
        }

        /* Hover & Active Effects */
        .launch-btn:hover {
            transform: scale(1.08) translateY(-3px);
            background: linear-gradient(135deg, #FFF000 0%, #FFA800 100%);
            box-shadow: 0px 15px 30px rgba(0, 0, 0, 0.5), 
                        0px 0px 30px rgba(255, 230, 0, 0.9);
        }

        .launch-btn:active {
            transform: scale(0.98) translateY(1px);
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.3);
        }

        /* Mobile Responsiveness */
        @media (max-width: 600px) {
            .launch-btn {
                padding: 14px 36px;
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>

    <div class="hero-container">
        <div class="hero-overlay"></div>
        <a href="https://tnsfproddatur.vercel.app/" class="launch-btn" target="_self">
            🚀 Launch
        </a>
    </div>

</body>
</html>
