<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Launching</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f 0%, #0f0f1a 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            max-width: 900px;
            width: 100%;
        }

        /* --- Laptop Frame Styling --- */
        .laptop-container {
            width: 100%;
            max-width: 750px;
            display: flex;
            flex-direction: column;
            align-items: center;
            perspective: 1000px;
        }

        .laptop-screen {
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            position: relative;
            background: #111;
            border: 14px solid #2d2d2d;
            border-radius: 20px 20px 0 0;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }

        .laptop-screen img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .laptop-base {
            width: 118%;
            height: 18px;
            background: linear-gradient(to bottom, #e0e0e0 0%, #a6a6a6 100%);
            border-radius: 0 0 12px 12px;
            position: relative;
            box-shadow: 0 15px 25px rgba(0,0,0,0.5);
        }

        /* Laptop Notch */
        .laptop-base::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 6px;
            background: #777;
            border-radius: 0 0 5px 5px;
        }

        /* --- Launch Button Styling --- */
        .launch-btn {
            background: linear-gradient(185deg, #ffeb3b 0%, #fbc02d 100%);
            color: #000;
            font-size: 1.4rem;
            font-weight: 700;
            padding: 16px 48px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 8px 25px rgba(251, 192, 45, 0.4);
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .launch-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 12px 30px rgba(251, 192, 45, 0.6);
            background: linear-gradient(185deg, #fff176 0%, #fbc02d 100%);
        }

        .launch-btn:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Laptop Frame -->
        <div class="laptop-container">
            <div class="laptop-screen">
                <!-- Using your provided image link directly -->
                <img src="https://lh3.googleusercontent.com/chat_attachment/AF9R_1O0GjN-D81wQjEwL6G9O-G3jP3K_p0Y1sM9hG4" alt="TNSF Kadapa Parliament Launch Poster">
            </div>
            <div class="laptop-base"></div>
        </div>

        <!-- Launch Button -->
        <a href="https://tnsfproddatur.vercel.app/" target="_blank" class="launch-btn">
            🚀 Launch Website
        </a>
    </div>

</body>
</html>
